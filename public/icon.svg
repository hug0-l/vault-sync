<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad3)" />

  <!-- Outer Hexagon Frame -->
  <polygon points="256,80 408,168 408,344 256,432 104,344 104,168"
           fill="none" stroke="url(#violetGrad)" stroke-width="20" stroke-linejoin="round" />

  <!-- Sync Arrow Left-to-Right (Downwards V) -->
