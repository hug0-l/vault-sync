  <polyline points="312,208 336,216 344,240" fill="none" stroke="#a7f3d0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sync Arrow Right-to-Left (Upwards V Overlay) -->
