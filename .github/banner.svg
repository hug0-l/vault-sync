<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient (Slate to Deep Slate) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Hexagon Gradient (Violet to Indigo) -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Border Gradient (Cyan to Green) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#175DDC" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Subtle Grid Overlay -->
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Neon Accent Border Top/Bottom -->
  <rect x="0" y="0" width="1280" height="6" fill="url(#accentGrad)" />
  <rect x="0" y="634" width="1280" height="6" fill="url(#accentGrad)" />

  <!-- ==============================
       LOGO GROUP (INTERLOCK-SYNC)
       Centered around (356, 320) of the canvas (translate origin at 100,64,
       local hex centre at 256,256 → 356,320). Sized 304 × 352.
       ============================== -->
  <g transform="translate(100, 64)">
    <!-- Outer Hexagon Frame -->
    <polygon points="256,80 408,168 408,344 256,432 104,344 104,168"
             fill="none" stroke="url(#violetGrad)" stroke-width="20" stroke-linejoin="round" />

    <!-- Sync Arrow Left-to-Right (Downwards V, Teal) -->
    <path d="M 176 216 L 256 320 L 336 216" fill="none" stroke="#a7f3d0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="312,208 336,216 344,240" fill="none" stroke="#a7f3d0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sync Arrow Right-to-Left (Upwards V Overlay, Blue) -->
    <path d="M 336 296 L 256 192 L 176 296" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="200,304 176,296 168,272" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==============================
       TYPOGRAPHY GROUP
       translate(640, 218): the visual centre of the text block
       (title top → badges bottom ≈ y 222..428) lands at y 325,
       aligned with the logo's vertical centre (y 320).
       ============================== -->
  <g transform="translate(640, 218)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title: vault-sync (baseline at relative y 60 → absolute y 278) -->
    <text x="0" y="60" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-1">vault-sync</text>

    <!-- Subtitle (baseline at relative y 120 → absolute y 338) -->
    <text x="0" y="120" font-size="30" font-weight="500" fill="#94A3B8">Headless vaultwarden &#8594; bitwarden mirror</text>

    <!-- Feature Badges (top at relative y 165 → absolute y 383, baseline 26 → 409) -->
    <g transform="translate(0, 165)" font-size="14" font-weight="600" text-anchor="middle">
      <!-- Badge 1: SELF-HOSTED -->
      <rect x="0" y="0" width="140" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="70" y="24" fill="#38BDF8">SELF-HOSTED</text>

      <!-- Badge 2: INTER-SYNC -->
      <rect x="152" y="0" width="140" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="222" y="24" fill="#34D399">INTER-SYNC</text>

      <!-- Badge 3: ENCRYPTED -->
      <rect x="304" y="0" width="140" height="38" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <text x="374" y="24" fill="#F43F5E">ENCRYPTED</text>
    </g>
  </g>
</svg>
